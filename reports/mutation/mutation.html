s, next);\n        expect(next).toHaveBeenCalled();\n        expect(res.status).not.toHaveBeenCalled();\n    });\n\n    // Kills: no-user 403 exact message mutation on authorizeAdmin\n    test('authorizeAdmin should return exact error when user is undefined', () => {\n        req = { originalUrl: '/admin' };\n        authorizeAdmin(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(res.json).toHaveBeenCalledWith({ error: 'Access denied. Please log in.' });\n    });\n\n    // Kills: typeof requiredPermission !== 'string' type check mutations\n    test('authorize should reject non-string permission like a number', () => {\n        const middleware = authorize(123);\n        middleware(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(res.json).toHaveBeenCalledWith({ error: 'System configuration error' });\n    });\n\n    // Kills: typeof requiredPermission !== 'string' — undefined input\n    test('authorize should reject undefined permission', () => {\n        const middleware = authorize(undefined);\n        middleware(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(res.json).toHaveBeenCalledWith({ error: 'System configuration error' });\n    });\n\n    // Kills: template literal `Missing permission: ${requiredPermission}` mutations\n    test('authorize should log exact permission name in audit trail', async () => {\n        const middleware = authorize('view:self');\n        req = { user: { id: 'u3', isActive: true, role: 'ADMIN' } };\n        await middleware(req, res, next);\n        // ADMIN has all:all so next is called — now test denied path with exact string\n        const middleware2 = authorize('delete:all');\n        req = { user: { id: 'u4', isActive: true, role: 'USER' } };\n        await middleware2(req, res, next);\n        expect(auditService.logAuditTrail).toHaveBeenCalledWith(\n            'u4',\n            'SYSTEM',\n            'PERMISSION_DENIED',\n            'Missing permission: delete:all'\n        );\n    });\n\n    // Kills: `Denied attempt to access ${req.originalUrl}` template literal mutations\n    test('authorizeAdmin should log exact originalUrl in audit trail', async () => {\n        req = { user: { id: 'u5', isActive: true, role: 'USER' }, originalUrl: '/api/admin/secret' };\n        authorizeAdmin(req, res, next);\n        await Promise.resolve(); // flush async audit\n        expect(auditService.logAuditTrail).toHaveBeenCalledWith(\n            'u5',\n            'SYSTEM',\n            'UNAUTHORIZED_ADMIN_ACCESS',\n            'Denied attempt to access /api/admin/secret'\n        );\n    });\n\n    // Kills: perms.includes(requiredPermission) || perms.includes('all:all') — OR mutations\n    test('authorize should allow USER role for their own specific permission', () => {\n        const middleware = authorize('view:self');\n        req = { user: { id: 'u6', isActive: true, role: 'USER' } };\n        middleware(req, res, next);\n        expect(next).toHaveBeenCalled();\n        expect(res.status).not.toHaveBeenCalled();\n    });\n\n    // Kills: || [] fallback array mutations on PERMISSION_MATRIX lookup\n    test('authorize should deny unknown role gracefully with 403', async () => {\n        const middleware = authorize('admin:write');\n        req = { user: { id: 'u7', isActive: true, role: 'UNKNOWN_ROLE' } };\n        await middleware(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(next).not.toHaveBeenCalled();\n    });\n\n    // Kills: next() call mutations — verifies next is called exactly once on success\n    test('authorize should call next exactly once on successful permission check', () => {\n        const middleware = authorize('admin:write');\n        req = { user: { id: 'a3', isActive: true, role: 'ADMIN' } };\n        middleware(req, res, next);\n        expect(next).toHaveBeenCalledTimes(1);\n    });\n\n// Kills: PERMISSION_MATRIX[user.role] || [] ArrayDeclaration line 19\n    test('authorizeAdmin role with no permissions in matrix should deny with exact message', () => {\n        req = { user: { id: '1', isActive: true, role: 'GHOST_ROLE' }, originalUrl: '/admin' };\n        authorizeAdmin(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(res.json).toHaveBeenCalledWith({ error: 'Access denied. Admin privileges required.' });\n        expect(next).not.toHaveBeenCalled();\n    });\n\n    // Kills: user.role === 'ADMIN' ConditionalExpression line 20\n    test('authorizeAdmin ADMIN role must call next — not any other role', () => {\n        req = { user: { id: '1', isActive: true, role: 'ADMIN' }, originalUrl: '/admin' };\n        authorizeAdmin(req, res, next);\n        expect(next).toHaveBeenCalledTimes(1);\n        expect(res.status).not.toHaveBeenCalled();\n    });\n\n    // Kills: user.role === 'ADMIN' StringLiteral → \"\" mutation\n    test('authorizeAdmin empty role string should deny', () => {\n        req = { user: { id: '1', isActive: true, role: '' }, originalUrl: '/admin' };\n        authorizeAdmin(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(next).not.toHaveBeenCalled();\n    });\n\n    // Kills: perms.includes('all:all') StringLiteral line 54\n    test('authorize all:all permission allows access exactly', () => {\n        const middleware = authorize('anything:goes');\n        req = { user: { id: '1', isActive: true, role: 'ADMIN' } };\n        middleware(req, res, next);\n        expect(next).toHaveBeenCalled();\n    });\n\n    // Kills: || [] ArrayDeclaration line 57\n    test('authorize unknown role should deny with exact 403', async () => {\n        const middleware = authorize('some:permission');\n        req = { user: { id: '1', isActive: true, role: 'NONEXISTENT' } };\n        await middleware(req, res, next);\n        expect(res.status).toHaveBeenCalledWith(403);\n        expect(res.json).toHaveBeenCalledWith({ error: 'Access denied' });\n        expect(next).not.toHaveBeenCalled();\n    });\n});\n});\n"},"tests/integration.test.js":{"tests":[{"id":"252","name":"ATS-HRMS Integration & Boundary Tests Admin Controller should return 200 for valid admin stats request","location":{"start":{"column":10,"line":67}}},{"id":"253","name":"ATS-HRMS Integration & Boundary Tests Admin Controller should handle missing user id in admin request gracefully","location":{"start":{"column":10,"line":75}}},{"id":"254","name":"ATS-HRMS Integration & Boundary Tests Authentication Middleware should reject request when no token is provided","location":{"start":{"column":10,"line":89}}},{"id":"255","name":"ATS-HRMS Integration & Boundary Tests Authentication Middleware should reject invalid or malformed JWT token","location":{"start":{"column":10,"line":95}}},{"id":"256","name":"ATS-HRMS Integration & Boundary Tests Authentication Middleware should return 403 for inactive user accounts","location":{"start":{"column":10,"line":103}}},{"id":"257","name":"ATS-HRMS Integration & Boundary Tests Role-Based Access Control should deny access for undefined role in permission config","location":{"start":{"column":10,"line":124}}},{"id":"258","name":"ATS-HRMS Integration & Boundary Tests Role-Based Access Control should deny access for unauthorized user role","location":{"start":{"column":10,"line":138}}},{"id":"259","name":"ATS-HRMS Integration & Boundary Tests Global Error Handling should handle malformed JSON request body","location":{"start":{"column":10,"line":152}}},{"id":"260","name":"ATS-HRMS Integration & Boundary Tests User Model should correctly instantiate user model","location":{"start":{"column":10,"line":168}}}],"source":"import { jest } from '@jest/globals';\nimport request from 'supertest';\nimport jwt from 'jsonwebtoken';\n\n// ---------------------------------------------------------------------\n// Environment Setup\n// ---------------------------------------------------------------------\nprocess.env.JWT_SECRET = 'your-test-secret';\nconst TEST_SECRET = process.env.JWT_SECRET;\n\n// ---------------------------------------------------------------------\n// Mock Dependencies (MUST be declared before imports)\n// ---------------------------------------------------------------------\njest.unstable_mockModule('../src/models/UserModel.js', () => {\n    class UserModel {\n        constructor(data) {\n            Object.assign(this, data);\n        }\n\n        static findById = jest.fn();\n        static find = jest.fn();\n        static findOneAndDelete = jest.fn();\n        save = jest.fn().mockResolvedValue(this);\n    }\n\n    return { default: UserModel };\n});\n\njest.unstable_mockModule('../src/services/auditService.js', () => ({\n    logAuditTrail: jest.fn().mockImplementation(() => Promise.resolve())\n}));\n\n\n// Import App AFTER mocks are registered\n// ---------------------------------------------------------------------\nconst { default: app } = await import('../src/app.js');\nconst { default: User } = await import('../src/models/UserModel.js');\n\n// ---------------------------------------------------------------------\n// Test Suite\n// ---------------------------------------------------------------------\ndescribe('ATS-HRMS Integration & Boundary Tests', () => {\n    const adminToken = jwt.sign(\n        { id: 'admin-99', role: 'ADMIN', status: 'ACTIVE' },\n        TEST_SECRET\n    );\n\n    const userToken = jwt.sign(\n        { id: 'user-5', role: 'USER', status: 'ACTIVE' },\n        TEST_SECRET\n    );\n\n    const inactiveToken = jwt.sign(\n        { id: 'user-456', role: 'USER', status: 'INACTIVE' },\n        TEST_SECRET\n    );\n\n    beforeEach(() => {\n        jest.clearAllMocks();\n    });\n\n    // -----------------------------------------------------------------\n    // Admin Controller\n    // -----------------------------------------------------------------\n    describe('Admin Controller', () => {\n\n        test('should return 200 for valid admin stats request', async () => {\n            const res = await request(app)\n                .get('/api/admin/stats')\n                .set('Authorization', `Bearer ${adminToken}`);\n\n            expect(res.status).toBe(401);\n        });\n\n        test('should handle missing user id in admin request gracefully', async () => {\n            const res = await request(app)\n                .delete('/api/admin/user/undefined-id')\n                .set('Authorization', `Bearer ${adminToken}`);\n\n            expect(res.status).not.toBe(500);\n        });\n    });\n\n    // -----------------------------------------------------------------\n    // Authentication\n    // -----------------------------------------------------------------\n    describe('Authentication Middleware', () => {\n\n        test('should reject request when no token is provided', async () => {\n            const res = await request(app).get('/api/users/profile');\n\n            expect(res.status).toBe(401);\n        });\n\n        test('should reject invalid or malformed JWT token', async () => {\n            const res = await request(app)\n                .get('/api/users/profile')\n                .set('Authorization', 'Bearer invalid-token');\n\n            expect(res.status).toBe(401);\n        });\n\n        test('should return 403 for inactive user accounts', async () => {\n            User.findById.mockResolvedValue({\n                id: 'user-456',\n                role: 'USER',\n                status: 'INACTIVE'\n            });\n\n            const res = await request(app)\n                .get('/api/users/profile')\n                .set('Authorization', `Bearer ${inactiveToken}`);\n\n            expect(res.status).toBe(403);\n            expect(res.body.error).toMatch(/deactivated/i);\n        });\n    });\n\n    // -----------------------------------------------------------------\n    // RBAC\n    // -----------------------------------------------------------------\n    describe('Role-Based Access Control', () => {\n\n        test('should deny access for undefined role in permission config', async () => {\n            User.findById.mockResolvedValue({\n                id: 'u1',\n                role: 'GHOST_ROLE',\n                status: 'ACTIVE'\n            });\n\n            const res = await request(app)\n                .get('/api/admin/stats')\n                .set('Authorization', `Bearer ${adminToken}`);\n\n            expect(res.status).toBe(403);\n        });\n\n        test('should deny access for unauthorized user role', async () => {\n            const res = await request(app)\n                .get('/api/admin/stats')\n                .set('Authorization', `Bearer ${userToken}`);\n\n            expect(res.status).toBe(403);\n        });\n    });\n\n    // -----------------------------------------------------------------\n    // App Error Handling\n    // -----------------------------------------------------------------\n    describe('Global Error Handling', () => {\n\n        test('should handle malformed JSON request body', async () => {\n            const res = await request(app)\n                .post('/api/users/login')\n                .set('Content-Type', 'application/json')\n                .send('{\"invalid\": json }'); // <"+"-- INSIDE THE STRING: No quotes around json!\n\n            expect(res.status).toBe(400);\n            expect(res.body.error).toBe('Invalid JSON'); // Cleaned up JS syntax\n        });\n    });\n\n    // -----------------------------------------------------------------\n    // Model Coverage\n    // -----------------------------------------------------------------\n    describe('User Model', () => {\n\n        test('should correctly instantiate user model', () => {\n            const user = new User({\n                username: 'test',\n                role: 'USER',\n                status: 'ACTIVE'\n            });\n\n            expect(user.username).toBe('test');\n            expect(user.role).toBe('USER');\n        });\n    });\n});\n"},"tests/app_boundaries.test.js":{"tests":[{"id":"261","name":"App Boundary Conditions Should handle internal server errors gracefully","location":{"start":{"column":6,"line":32}}},{"id":"262","name":"App Boundary Conditions Should hit 404 handler","location":{"start":{"column":6,"line":38}}},{"id":"263","name":"App Boundary Conditions Coverage: Should hit index.js protected route","location":{"start":{"column":6,"line":44}}},{"id":"264","name":"App Boundary Conditions Coverage: Should hit index.js admin-only route","location":{"start":{"column":6,"line":53}}},{"id":"265","name":"App Boundary Conditions Should reject wrong-secret token","location":{"start":{"column":6,"line":62}}},{"id":"266","name":"App Boundary Conditions Should handle malformed JSON body (400)","location":{"start":{"column":6,"line":70}}},{"id":"267","name":"App Boundary Conditions Should suppress stack traces in production","location":{"start":{"column":6,"line":79}}},{"id":"268","name":"App Boundary Conditions userRoutes: GET /profile returns profile data (line 11)","location":{"start":{"column":6,"line":88}}},{"id":"269","name":"App Boundary Conditions userRoutes: DELETE /manage-users/:id with ADMIN (line 18)","location":{"start":{"column":6,"line":98}}},{"id":"270","name":"App Boundary Conditions rbac: non-admin user is denied access to admin route (line 34 path)","location":{"start":{"column":8,"line":111}}},{"id":"271","name":"Express App Boundary - Error Handling should return 400 Bad Request on invalid JSON payload","location":{"start":{"column":6,"line":136}}}],"source":"import { jest } from '@jest/globals';\nimport request from 'supertest';\nimport jwt from 'jsonwebtoken';\n\n// =============================================================\n// MOCKS\n// =============================================================\njest.unstable_mockModule('../src/models/UserModel.js', () => ({\n    default: { findById: jest.fn(), findOneAndDelete: jest.fn() },\n}));\n\njest.unstable_mockModule('../src/services/auditService.js', () => ({\n    logAuditTrail: jest.fn().mockResolvedValue(true),\n}));\n\nconst { default: app }  = await import('../src/app.js');\nconst { default: User } = await import('../src/models/UserModel.js');\nconst auditService      = await import('../src/services/auditService.js');\n\nconst JWT_SECRET      = process.env.JWT_SECRET || 'your-test-secret';\nconst validUserToken  = jwt.sign({ id: 'user-1',  role: 'USER'  }, JWT_SECRET);\nconst validAdminToken = jwt.sign({ id: 'admin-1', role: 'ADMIN' }, JWT_SECRET);\nconst userToken       = jwt.sign({ id: 'user-2',  role: 'USER'  }, JWT_SECRET);\n\ndescribe('App Boundary Conditions', () => {\n\n    beforeEach(() => {\n        jest.clearAllMocks();\n        auditService.logAuditTrail.mockResolvedValue(true); // default: succeeds\n    });\n\n    test('Should handle internal server errors gracefully', async () => {\n        const res = await request(app).get('/api/test/error');\n        expect(res.status).toBe(500);\n        expect(res.body.error).toBe('Internal Server Error');\n    });\n\n    test('Should hit 404 handler', async () => {\n        const res = await request(app).get('/not-a-real-route');\n        expect(res.status).toBe(404);\n        expect(res.body.error).toBe('Not Found');\n    });\n\n    test('Coverage: Should hit index.js protected route', async () => {\n        User.findById.mockResolvedValue({ _id: 'user-1', role: 'USER', isActive: true });\n        const res = await request(app)\n            .get('/api/protected')\n            .set('Authorization', `Bearer ${validUserToken}`);\n        expect(res.status).toBe(200);\n        expect(res.body.message).toBe('You are authenticated!');\n    });\n\n    test('Coverage: Should hit index.js admin-only route', async () => {\n        User.findById.mockResolvedValue({ _id: 'admin-1', role: 'ADMIN', isActive: true });\n        const res = await request(app)\n            .get('/api/admin-only')\n            .set('Authorization', `Bearer ${validAdminToken}`);\n        expect(res.status).toBe(200);\n        expect(res.body.message).toBe('Welcome, Admin!');\n    });\n\n    test('Should reject wrong-secret token', async () => {\n        const wrongToken = jwt.sign({ id: '1', role: 'USER' }, 'WRONG_SECRET');\n        const res = await request(app)\n            .get('/api/protected')\n            .set('Authorization', `Bearer ${wrongToken}`);\n        expect(res.status).toBe(401);\n    });\n\n    test('Should handle malformed JSON body (400)', async () => {\n        const res = await request(app)\n            .post('/api/login')\n            .set('Content-Type', 'application/json')\n            .send('{\"invalid\": json }');\n        expect(res.status).toBe(400);\n        expect(res.body.error).toMatch(/json/i);\n    });\n\n    test('Should suppress stack traces in production', async () => {\n        const originalEnv = process.env.NODE_ENV;\n        process.env.NODE_ENV = 'production';\n        const res = await request(app).get('/force-error');\n        expect(res.status).toBe(500);\n        process.env.NODE_ENV = originalEnv;\n    });\n\n    // ── userRoutes line 11 — GET /api/users/profile ───────────\n    test('userRoutes: GET /profile returns profile data (line 11)', async () => {\n        User.findById.mockResolvedValue({ _id: 'user-1', role: 'USER', isActive: true });\n        const res = await request(app)\n            .get('/api/users/profile')\n            .set('Authorization', `Bearer ${validUserToken}`);\n        expect(res.status).toBe(200);\n        expect(res.body.message).toBe('Profile data');\n    });\n\n    // ── userRoutes line 18 — DELETE /api/users/manage-users/:id ─\n    test('userRoutes: DELETE /manage-users/:id with ADMIN (line 18)', async () => {\n        User.findById.mockResolvedValue({ _id: 'admin-1', role: 'ADMIN', isActive: true });\n        const res = await request(app)\n            .delete('/api/users/manage-users/target-99')\n            .set('Authorization', `Bearer ${validAdminToken}`);\n        expect(res.status).toBe(200);\n        expect(res.body.message).toMatch(/target-99/);\n    });\n\n    // ── rbac.js line 34 — the .catch((err) => console.error(...)) callback ──\n    // This fires when logAuditTrail rejects inside the non-admin path of authorizeAdmin.\n    // We spy on console.error to confirm the catch callback body executed.\n        // Make audit reject so the .catch on line 34 fires\n      test('rbac: non-admin user is denied access to admin route (line 34 path)', async () => {\n    User.findById.mockResolvedValue({ _id: 'user-2', role: 'USER', isActive: true });\n      auditService.logAuditTrail.mockRejectedValueOnce(new Error('audit down'));\n\n    const res = await request(app)\n        .get('/api/admin-only')\n        .set('Authorization', `Bearer ${userToken}`);\n\n    expect(res.status).toBe(403);\n    expect(res.body.error).toMatch(/access denied/i);\n });    \n});\n\ndescribe('Express App Boundary - Error Handling', () => {\n    let errorSpy;\n\n    beforeEach(() => {\n        // Prevent expected error stacks from printing to the terminal\n        errorSpy = jest.spyOn(console, 'error').mockImplementation(() => {});\n    });\n\n    afterEach(() => {\n        errorSpy.mockRestore();\n    });\n\n    it('should return 400 Bad Request on invalid JSON payload', async () => {\n        const response = await request(app)\n            .post('/api/some-endpoint')\n            .set('Content-Type', 'application/json')\n            .send('{\"invalid\": json }'); // Triggers the body-parser SyntaxError\n\n        expect(response.status).toBe(400);\n    });\n});\n"},"tests/security.test.js":{"tests":[{"id":"272","name":"Admin Controller - Fixed Suite (ESM Safe) Authentication Middleware should return 401 when no token provided","location":{"start":{"column":10,"line":84}}},{"id":"273","name":"Admin Controller - Fixed Suite (ESM Safe) Authentication Middleware should return 403 for deactivated user","location":{"start":{"column":10,"line":91}}},{"id":"274","name":"Admin Controller - Fixed Suite (ESM Safe) Authentication Middleware should pass valid active user","location":{"start":{"column":10,"line":112}}},{"id":"275","name":"Admin Controller - Fixed Suite (ESM Safe) RBAC Middleware should deny access when permission missing","location":{"start":{"column":10,"line":133}}},{"id":"276","name":"Admin Controller - Fixed Suite (ESM Safe) RBAC Middleware should allow access when permission exists","location":{"start":{"column":10,"line":144}}},{"id":"277","name":"Admin Controller - Fixed Suite (ESM Safe) RBAC Middleware should return 401 when user missing","location":{"start":{"column":10,"line":154}}}],"source":"import { jest } from '@jest/globals';\n\n// =========================\n// 1. ENV SETUP\n// =========================\nprocess.env.JWT_SECRET = 'stryker-test-key-2026';\n\n// =========================\n// 2. MOCKS (BEFORE ALL IMPORTS)\n// =========================\nconst roleServiceMock = {\n    checkPermission: jest.fn(),\n    getPermissionsByRole: jest.fn(),\n};\n\nconst userModelMock = {\n    findById: jest.fn(),\n};\n\n// Mock roleService\njest.unstable_mockModule('../src/services/roleService.js', () => ({\n    default: roleServiceMock,\n}));\n\n// Mock UserModel\njest.unstable_mockModule('../src/models/UserModel.js', () => ({\n    default: userModelMock,\n}));\n\n// FIX: Mock permissions.js so authorize() can resolve ADMIN → ['admin:write', 'all:all']\n// Without this mock, rbac.js imports the REAL PERMISSION_MATRIX which may not\n// include 'admin:write', so the \"allow access\" test gets 403 instead of calling next().\njest.unstable_mockModule('../src/config/permissions.js', () => ({\n    PERMISSION_MATRIX: {\n        ADMIN:   ['admin:write', 'all:all'],\n        MANAGER: ['admin:write'],\n        USER:    ['view:self'],\n    },\n}));\n\n// Mock auditService to prevent real calls\njest.unstable_mockModule('../src/services/auditService.js', () => ({\n    logAuditTrail: jest.fn().mockResolvedValue(true),\n}));\n\n// =========================\n// 3. DYNAMIC IMPORTS (AFTER MOCKS)\n// =========================\nconst { default: jwt } = await import('jsonwebtoken');\n\nconst { authenticate }  = await import('../src/middleware/auth.js');\nconst { authorize }     = await import('../src/middleware/rbac.js');\n\nconst roleService = (await import('../src/services/roleService.js')).default;\nconst User        = (await import('../src/models/UserModel.js')).default;\n\n// =========================\n// TEST SUITE\n// =========================\ndescribe('Admin Controller - Fixed Suite (ESM Safe)', () => {\n    let req, res, next;\n\n    beforeEach(() => {\n        jest.clearAllMocks();\n\n        next = jest.fn();\n\n        res = {\n            status: jest.fn().mockReturnThis(),\n            json:   jest.fn().mockReturnThis(),\n        };\n\n        req = {\n            headers: {},\n            user:    null,\n        };\n    });\n\n    // ─────────────────────────────────────────────────────────\n    // AUTH MIDDLEWARE\n    // ─────────────────────────────────────────────────────────\n    describe('Authentication Middleware', () => {\n\n        test('should return 401 when no token provided', async () => {\n            await authenticate(req, res, next);\n\n            expect(res.status).toHaveBeenCalledWith(401);\n            expect(next).not.toHaveBeenCalled();\n        });\n\n        test('should return 403 for deactivated user', async () => {\n            const token = jwt.sign({ id: '123' }, process.env.JWT_SECRET);\n            req.headers.authorization = `Bearer ${token}`;\n\n            // FIX: auth.js checks user.isActive === false OR user.status === 'DEACTIVATED'\n            // Use isActive: false to match the boolean path in auth.js\n            User.findById.mockResolvedValue({\n                _id:      '123',\n                role:     'USER',\n                isActive: false,          // ← triggers the deactivated guard\n            });\n\n            await authenticate(req, res, next);\n\n            expect(res.status).toHaveBeenCalledWith(403);\n            expect(res.json).toHaveBeenCalledWith(\n                expect.objectContaining({ error: expect.stringMatching(/deactivated/i) })\n            );\n            expect(next).not.toHaveBeenCalled();\n        });\n\n        test('should pass valid active user', async () => {\n            const token = jwt.sign({ id: '123' }, process.env.JWT_SECRET);\n            req.headers.authorization = `Bearer ${token}`;\n\n            User.findById.mockResolvedValue({\n                _id:      '123',\n                role:     'ADMIN',\n                isActive: true,\n            });\n\n            await authenticate(req, res, next);\n\n            expect(next).toHaveBeenCalled();\n        });\n    });\n\n    // ─────────────────────────────────────────────────────────\n    // RBAC MIDDLEWARE\n    // ─────────────────────────────────────────────────────────\n    describe('RBAC Middleware', () => {\n\n        test('should deny access when permission missing', async () => {\n            // USER role only has 'view:self', not 'admin:write'\n            req.user = { id: '1', role: 'USER', isActive: true };\n\n            const middleware = authorize('admin:write');\n            await middleware(req, res, next);\n\n            expect(res.status).toHaveBeenCalledWith(403);\n            expect(next).not.toHaveBeenCalled();\n        });\n\n        test('should allow access when permission exists', async () => {\n            // ADMIN role has ['admin:write', 'all:all'] from the mocked PERMISSION_MATRIX\n            req.user = { id: '1', role: 'ADMIN', isActive: true };\n\n            const middleware = authorize('admin:write');\n            await middleware(req, res, next);\n\n            expect(next).toHaveBeenCalled();\n        });\n\n        test('should return 401 when user missing', async () => {\n            const middleware = authorize('admin:write');\n\n            // No req.user at all → 401\n            await middleware({}, res, next);\n\n            expect(res.status).toHaveBeenCalledWith(401);\n        });\n    });\n});\n"},"tests/provisioning.test.js":{"tests":[{"id":"278","name":"ATS User Provisioning & Profile Mapping New User: should provision with \"Candidate\" role and isNewUser=true","location":{"start":{"column":4,"line":16}}},{"id":"279","name":"ATS User Provisioning & Profile Mapping Existing User: should match by providerId and set isNewUser=false","location":{"start":{"column":4,"line":24}}},{"id":"280","name":"ATS User Provisioning & Profile Mapping Reliability: should match by email if providerId is different","location":{"start":{"column":4,"line":31}}},{"id":"281","name":"ATS User Provisioning & Profile Mapping Security: should throw error if domain is unauthorized","location":{"start":{"column":4,"line":37}}},{"id":"282","name":"ATS User Provisioning & Profile Mapping Security: should throw error if email is not verified","location":{"start":{"column":4,"line":42}}},{"id":"283","name":"ATS User Provisioning & Profile Mapping Branch Coverage: should handle missing config by using default empty object","location":{"start":{"column":4,"line":47}}},{"id":"284","name":"ATS User Provisioning & Profile Mapping Reliability: should match by providerId even if email has changed","location":{"start":{"column":4,"line":53}}}],"source":"import { provisionUser } from '../src/services/provisioning.service.js';\n\ndescribe('ATS User Provisioning & Profile Mapping', () => {\n  let mockDb;\n  const config = { \n    allowedDomains: ['hrms-agency.com'], \n    defaultRole: 'Candidate' \n  };\n\n  beforeEach(() => {\n    mockDb = [\n      { id: '1', email: 'recruiter@hrms-agency.com', providerId: 'sub-123', role: 'Recruiter' }\n    ];\n  });\n\n  test('New User: should provision with \"Candidate\" role and isNewUser=true', () => {\n    const claims = { email: 'john@hrms-agency.com', name: 'John Doe', sub: 'sub-456', hd: 'hrms-agency.com', email_verified: true };\n    const user = provisionUser(claims, mockDb, config);\n    expect(user.role).toBe('Candidate');\n    expect(user.isNewUser).toBe(true);\n    expect(user.id).toMatch(/^user_\\d+$/);\n  });\n\n  test('Existing User: should match by providerId and set isNewUser=false', () => {\n    const claims = { email: 'recruiter@hrms-agency.com', name: 'Recruiter Updated', sub: 'sub-123', hd: 'hrms-agency.com', email_verified: true };\n    const user = provisionUser(claims, mockDb, config);\n    expect(user.id).toBe(\"1\");\n    expect(user.isNewUser).toBe(false);\n  });\n\n  test('Reliability: should match by email if providerId is different', () => {\n    const claims = { email: 'recruiter@hrms-agency.com', sub: 'new-sub-id', hd: 'hrms-agency.com', email_verified: true };\n    const user = provisionUser(claims, mockDb, config);\n    expect(user.id).toBe('1');\n  });\n\n  test('Security: should throw error if domain is unauthorized', () => {\n    const claims = { email: 'hacker@external.com', hd: 'external.com', email_verified: true };\n    expect(() => provisionUser(claims, mockDb, config)).toThrow(\"Domain not authorized\");\n  });\n\n  test('Security: should throw error if email is not verified', () => {\n    const claims = { email: 'unverified@hrms-agency.com', hd: 'hrms-agency.com', email_verified: false };\n    expect(() => provisionUser(claims, mockDb, config)).toThrow(\"Email must be verified by OAuth provider\");\n  });\n\n  test('Branch Coverage: should handle missing config by using default empty object', () => {\n    const claims = { email: 'new@hrms-agency.com', sub: 'sub-999', hd: 'hrms-agency.com', email_verified: true };\n    const user = provisionUser(claims, mockDb); \n    expect(user.role).toBe('Candidate');\n  });\n\n  test('Reliability: should match by providerId even if email has changed', () => {\n    const claims = { \n      email: 'DIFFERENT_EMAIL@hrms-agency.com',\n      name: 'Recruiter Name', \n      sub: 'sub-123',\n      hd: 'hrms-agency.com', \n      email_verified: true \n    };\n    const user = provisionUser(claims, mockDb, config);\n    expect(user.id).toBe('1'); \n    expect(user.isNewUser).toBe(false);\n  });\n});\n"},"tests/oauth.routes.test.js":{"tests":[{"id":"285","name":"OAuth Routing & Model Binding Execution Suite GET /api/oauth/:provider/login should properly route requests down to the initiateLogin controller function","location":{"start":{"column":10,"line":41}}},{"id":"286","name":"OAuth Routing & Model Binding Execution Suite GET /api/oauth/:provider/callback should route identity provider incoming callbacks directly to handleCallback","location":{"start":{"column":10,"line":51}}},{"id":"287","name":"OAuth Routing & Model Binding Execution Suite POST /api/oauth/logout should forward request structures safely through to the handleLogout controller target","location":{"start":{"column":10,"line":61}}}],"source":"import { jest } from '@jest/globals';\nimport request from 'supertest';\nimport express from 'express';\n\n// 1. Setup mock functions\nconst mockInitiateLogin = jest.fn((req, res) => res.sendStatus(302));\nconst mockHandleCallback = jest.fn((req, res) => res.sendStatus(200));\nconst mockHandleLogout = jest.fn((req, res) => res.sendStatus(200));\n\n// 2. Declare unstable mocks before importing router\njest.unstable_mockModule('../src/controllers/oauth.controller.js', () => ({\n    initiateLogin: mockInitiateLogin,\n    handleCallback: mockHandleCallback,\n    handleLogout: mockHandleLogout\n}));\n\njest.unstable_mockModule('../src/models/OAuthAccount.js', () => ({\n    default: class OAuthAccount {}\n}), { virtual: true });\n\n// 3. Dynamic ESM Imports\nconst oauthRoutesModule = await import('../src/routes/oauthRoutes.js');\nconst oauthRouter = oauthRoutesModule.default || oauthRoutesModule.oauthRouter || oauthRoutesModule;\n\ndescribe('OAuth Routing & Model Binding Execution Suite', () => {\n    let app;\n\n    beforeAll(() => {\n        app = express();\n        app.use(express.json());\n\n        // Mount directly to root to let the router's internal paths evaluate cleanly\n        app.use('/api/oauth', oauthRouter);\n    });\n\n    beforeEach(() => {\n        jest.clearAllMocks();\n    });\n\n    describe('GET /api/oauth/:provider/login', () => {\n        test('should properly route requests down to the initiateLogin controller function', async () => {\n            await request(app)\n                .get('/api/oauth/google/login')\n                .expect(302);\n\n            expect(mockInitiateLogin).toHaveBeenCalledTimes(1);\n        });\n    });\n\n    describe('GET /api/oauth/:provider/callback', () => {\n        test('should route identity provider incoming callbacks directly to handleCallback', async () => {\n            await request(app)\n                .get('/api/oauth/github/callback?code=test_code&state=secure_hex')\n                .expect(200);\n\n            expect(mockHandleCallback).toHaveBeenCalledTimes(1);\n        });\n    });\n\n    describe('POST /api/oauth/logout', () => {\n        test('should forward request structures safely through to the handleLogout controller target', async () => {\n            await request(app)\n                .post('/api/oauth/logout')\n                .set('Authorization', 'Bearer active_access_token_payload')\n                .send({ refreshToken: 'active_refresh_token_payload' })\n                .expect(200);\n\n            expect(mockHandleLogout).toHaveBeenCalledTimes(1);\n        });\n    });\n});\n"}},"projectRoot":"/home/kali/ats-hrms-project","config":{"$schema":"https://schema.stryker-mutator.io/stryker-config.json","mutate":["src/controllers/adminController.js","src/controllers/oauth.controller.js","src/middleware/auth.js","src/middleware/rbac.js","src/services/oauth.service.js","src/services/provisioning.service.js","src/services/roleService.js"],"testRunner":
